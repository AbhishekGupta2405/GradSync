spring:
  application:
    name: user-service
  
  datasource:
    # Uses Docker env var SPRING_DATASOURCE_URL when running in container,
    # falls back to localhost:3307 for local development
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/gradsync_user_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:gradsync_user}
    password: ${SPRING_DATASOURCE_PASSWORD:gradsync_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

server:
  port: 8082 # Unique port for User Service. (Auth is 8081, BFF will be 8080)

aws:
  s3:
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
    region: ${AWS_REGION}
    bucket: ${AWS_S3_BUCKET_NAME}
