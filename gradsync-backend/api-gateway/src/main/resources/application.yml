server:
  port: 8080 # This is the main port the React frontend speaks to!

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        # Auth Service Route
        - id: auth-service
          uri: http://auth-service:8081 # Docker service name
          predicates:
            - Path=/api/v1/auth/**
            
        # User Service Route
        - id: user-service
          uri: http://user-service:8082 # Docker service name
          predicates:
            - Path=/api/v1/profiles/**
          filters:
            - AuthenticationFilter
            
        # Job Service Route
        - id: job-service
          uri: http://job-service:8083 # Docker service name
          predicates:
            - Path=/api/v1/jobs/**
            
        # Post Service Route
        - id: post-service
          uri: http://post-service:8084 # Docker service name
          predicates:
            - Path=/api/v1/posts/**
            
        
            
        # Events Service Route
        - id: events-service
          uri: http://events-service:8086 # Docker service name
          predicates:
            - Path=/api/v1/events/**
            
        # Stats Service Route
        - id: stats-service
          uri: http://stats-service:8087 # Docker service name
          predicates:
            - Path=/api/v1/stats/**
            
management:
  endpoints:
    web:
      exposure:
        include: gateway
