name: GradSync CI/CD Pipeline

on:
  push:
    branches:
      - main  # Triggers on every push to main branch

jobs:
  deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Copy entire project to EC2 via SCP
      - name: Copy project files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/gradsync"

      # Step 3: SSH into EC2, write .env and deploy
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # command_timeout is important for long builds
          command_timeout: 30m
          script: |
            cd /home/ubuntu/gradsync/gradsync-backend

            # Write the production .env file from GitHub Secrets
            cat > .env << EOF
            MYSQL_USER=${{ secrets.MYSQL_USER }}
            MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
            RDS_ENDPOINT=${{ secrets.RDS_ENDPOINT }}
            LINKEDIN_CLIENT_ID=${{ secrets.LINKEDIN_CLIENT_ID }}
            LINKEDIN_CLIENT_SECRET=${{ secrets.LINKEDIN_CLIENT_SECRET }}
            LINKEDIN_REDIRECT_URI=${{ secrets.LINKEDIN_REDIRECT_URI }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            AWS_S3_BUCKET_NAME=${{ secrets.AWS_S3_BUCKET_NAME }}
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            CORS_ALLOWED_ORIGIN=${{ secrets.CORS_ALLOWED_ORIGIN }}
            EOF

            # Stop current containers
            docker compose -f docker-compose.yml -f docker-compose.prod.yml down

            # Free up space before building (important on t2.micro)
            docker system prune -f

            # Build services sequentially to prevent RAM exhaustion on t2.micro
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build auth-service
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build user-service
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build job-service
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build post-service
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build events-service
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build stats-service
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build api-gateway
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build frontend

            # Start all services
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

            # Print status
            echo "--- Container Status ---"
            docker compose ps

      - name: Deployment complete
        run: |
          echo "✅ GradSync deployed to http://${{ secrets.EC2_HOST }}"
